<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Apps Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="header-spacer"></div>

    <div class="section-title" id="catTitle">Category</div>
    <div class="category-chips" id="filterBar"></div>
    <div id="appList" style="padding-bottom:20px;">
        <div class="loading-screen"><div class="spinner"></div><p>Loading apps...</p></div>
    </div>
    <div id="allLoaded" style="text-align:center;padding:16px;color:#888;font-size:13px;display:none;">All apps loaded</div>

    <div id="footerContainer"></div>
    <div id="modalsContainer"></div>
    <div id="navContainer"></div>

    <script>
        document.getElementById('headerContainer').innerHTML = renderHeader();
        document.getElementById('footerContainer').innerHTML = renderFooter();
        document.getElementById('modalsContainer').innerHTML = renderSharedModals();
        document.getElementById('navContainer').innerHTML = renderBottomNav('home');

        var params = new URLSearchParams(location.search);
        var cat = params.get('cat') || 'all';
        var CATS = ['all','social','games','tools','entertainment','education','productivity'];

        document.getElementById('catTitle').textContent = cat === 'all' ? 'All Apps' : cat.charAt(0).toUpperCase() + cat.slice(1);

        var chips = '';
        CATS.forEach(function(c) {
            chips += '<button class="chip ' + (c === cat ? 'active' : '') + '" onclick="location.href=\'categories.html?cat=' + c + '\'">' + (c === 'all' ? 'All' : c.charAt(0).toUpperCase() + c.slice(1)) + '</button>';
        });
        document.getElementById('filterBar').innerHTML = chips;

        var q = db.collection('apps');
        if (cat !== 'all') q = q.where('category', '==', cat);
        q.orderBy('downloads', 'desc').get().then(function(snap) {
            var list = document.getElementById('appList');
            if (snap.empty) {
                list.innerHTML = '<div class="no-results"><i class="fas fa-box-open"></i><p>No apps found</p></div>';
                return;
            }
            var html = '';
            snap.docs.forEach(function(doc, i) {
                var a = processAppName(Object.assign({id: doc.id}, doc.data()));
                var n = a.displayName || a.name;
                html += '<div class="ps-list-item" onclick="navTo(\'app.html?id=' + a.id + '\')">';
                html += '<div class="ps-rank">' + (i+1) + '</div>';
                html += '<img src="' + (a.logo||'') + '" alt="' + n + '" loading="lazy" onerror="this.src=\'' + getErrorImg(n) + '\'">';
                html += '<div class="ps-list-info"><div class="ps-list-name">' + n + '</div>';
                html += '<div class="ps-list-sub">' + (a.category||'') + ' &bull; ' + (a.downloads||0) + ' downloads</div></div>';
                html += '<button class="ps-install-btn" onclick="event.stopPropagation();navTo(\'app.html?id=' + a.id + '\')">Install</button></div>';
            });
            list.innerHTML = html;
            document.getElementById('allLoaded').style.display = 'block';
        }).catch(function(e) {
            document.getElementById('appList').innerHTML = '<div class="no-results"><p>Failed to load</p></div>';
        });

        function navTo(url) { location.href = url; }
    </script>
</body>
</html>
