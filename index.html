  <body>
    <script>
      (function () {
        try {
          var m = localStorage.getItem('apps-studio-theme') || 'light';
          var dark =
            m === 'dark' ||
            (m === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.add(dark ? 'theme-dark' : 'theme-light');
          document.documentElement.classList.add(
            'theme-month-' + (new Date().getMonth() + 1)
          );
          document.documentElement.dataset.socialAd = 'off';
          document.documentElement.dataset.popAd = 'off';
        } catch (e) {
          document.documentElement.classList.add(
            'theme-light',
            'theme-month-' + (new Date().getMonth() + 1)
          );
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script data-element-picker src="/element-picker.js"></script>
