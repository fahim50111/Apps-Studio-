<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Detail - Apps Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="header-spacer"></div>

    <div id="loadingState" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading...</p>
    </div>

    <div id="appDetailContent" style="display:none;padding:16px;max-width:600px;margin:0 auto;"></div>

    <div id="errorState" style="display:none;text-align:center;padding:60px 20px;">
        <i class="fas fa-exclamation-circle" style="font-size:48px;color:#ccc;margin-bottom:12px;"></i>
        <h2>App not found</h2>
        <a href="index.html" style="display:inline-block;margin-top:16px;background:#1a73e8;color:white;padding:10px 24px;border-radius:20px;text-decoration:none;">Go Home</a>
    </div>

    <div id="footerContainer"></div>
    <div id="modalsContainer"></div>
    <div id="navContainer"></div>

    <script>
        document.getElementById('headerContainer').innerHTML = renderHeader();
        document.getElementById('footerContainer').innerHTML = renderFooter();
        document.getElementById('modalsContainer').innerHTML = renderSharedModals();
        document.getElementById('navContainer').innerHTML = renderBottomNav('home');

        var params = new URLSearchParams(location.search);
        var appId = params.get('id');

        if (!appId) {
            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('errorState').style.display = 'block';
        } else {
            db.collection('apps').doc(appId).get().then(function(doc) {
                document.getElementById('loadingState').style.display = 'none';
                if (!doc.exists) {
                    document.getElementById('errorState').style.display = 'block';
                    return;
                }
                var app = processAppName(Object.assign({id: doc.id}, doc.data()));
                var n = app.displayName || app.name;
                var html = '';
                html += '<div style="display:flex;gap:16px;align-items:center;margin-bottom:20px;">';
                html += '<img src="' + (app.logo||'') + '" alt="' + n + '" style="width:80px;height:80px;border-radius:18px;object-fit:cover;background:#f0f0f0;" onerror="this.src=\'' + getErrorImg(n) + '\'">';
                html += '<div><h1 style="font-size:20px;margin-bottom:4px;">' + n + '</h1>';
                html += '<p style="color:#888;font-size:13px;">' + (app.category || 'App') + '</p>';
                html += '<p style="color:#f57c00;font-size:13px;margin-top:4px;">★★★★★ 5.0 (Free)</p></div></div>';

                html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px;text-align:center;">';
                html += '<div><p style="font-weight:700;">' + (app.downloads||0) + '+</p><p style="font-size:11px;color:#888;">Downloads</p></div>';
                html += '<div><p style="font-weight:700;">' + (app.size || 'N/A') + '</p><p style="font-size:11px;color:#888;">Size</p></div>';
                html += '<div><p style="font-weight:700;">4.5★</p><p style="font-size:11px;color:#888;">Rating</p></div>';
                html += '<div><p style="font-weight:700;">Free</p><p style="font-size:11px;color:#888;">Price</p></div></div>';

                if (app.downloadLink) {
                    html += '<a href="download.html?id=' + app.id + '&link=' + encodeURIComponent(app.downloadLink) + '" style="display:block;background:#1a73e8;color:white;text-align:center;padding:14px;border-radius:24px;text-decoration:none;font-weight:700;margin-bottom:12px;"><i class="fas fa-download"></i> Install Now</a>';
                }

                html += '<div style="background:white;border-radius:12px;padding:16px;margin-bottom:16px;">';
                html += '<h3 style="font-size:15px;margin-bottom:8px;">About this app</h3>';
                html += '<p style="font-size:13px;color:#555;line-height:1.6;">' + (app.description || 'No description available.') + '</p></div>';

                html += '<div style="background:white;border-radius:12px;padding:16px;">';
                html += '<h3 style="font-size:15px;margin-bottom:8px;">App Info</h3>';
                html += '<p style="font-size:13px;color:#666;"><strong>Category:</strong> ' + (app.category || '—') + '</p>';
                html += '<p style="font-size:13px;color:#666;"><strong>Size:</strong> ' + (app.size || 'N/A') + '</p>';
                html += '<p style="font-size:13px;color:#666;"><strong>Developer:</strong> Apps Studio</p></div>';

                document.getElementById('appDetailContent').innerHTML = html;
                document.getElementById('appDetailContent').style.display = 'block';
                document.title = n + ' - Apps Studio';
            }).catch(function() {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
            });
        }
    </script>
</body>
</html>
