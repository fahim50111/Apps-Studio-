<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top List - Apps Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="header-spacer"></div>

    <div class="section-title">
        <span><i class="fas fa-fire" style="color:#e53935;margin-right:6px;"></i> Top Downloads</span>
        <span style="font-size:12px;color:#888;">Most downloaded apps</span>
    </div>

    <div class="category-chips" id="filterBar">
        <button class="chip active" data-cat="all">All</button>
        <button class="chip" data-cat="social">Social</button>
        <button class="chip" data-cat="games">Games</button>
        <button class="chip" data-cat="tools">Tools</button>
        <button class="chip" data-cat="entertainment">Entertainment</button>
        <button class="chip" data-cat="education">Education</button>
        <button class="chip" data-cat="productivity">Productivity</button>
    </div>

    <div id="appList">
        <div class="loading-screen"><div class="spinner"></div><p>Loading...</p></div>
    </div>
    <div id="allLoaded" style="text-align:center;padding:16px;color:#888;font-size:13px;display:none;">All apps loaded</div>

    <div id="footerContainer"></div>
    <div id="modalsContainer"></div>
    <div id="navContainer"></div>

    <script>
        document.getElementById('headerContainer').innerHTML = renderHeader();
        document.getElementById('footerContainer').innerHTML = renderFooter();
        document.getElementById('modalsContainer').innerHTML = renderSharedModals();
        document.getElementById('navContainer').innerHTML = renderBottomNav('toplist');

        var allApps = [];
        var currentCat = 'all';

        function renderList(apps) {
            var list = document.getElementById('appList');
            if (!apps.length) {
                list.innerHTML = '<div class="no-results"><i class="fas fa-box-open"></i><p>No apps found</p></div>';
                return;
            }
            var html = '';
            apps.forEach(function(a, i) {
                var n = a.displayName || a.name;
                html += '<div class="ps-list-item" onclick="location.href=\'app.html?id=' + a.id + '\'">';
                html += '<div class="ps-rank">' + (i+1) + '</div>';
                html += '<img src="' + (a.logo||'') + '" alt="' + n + '" loading="lazy" onerror="this.src=\'' + getErrorImg(n) + '\'">';
                html += '<div class="ps-list-info"><div class="ps-list-name">' + n + '</div>';
                html += '<div class="ps-list-sub">' + (a.category||'') + ' &bull; ' + (a.downloads||0) + ' downloads</div></div>';
                html += '<button class="ps-install-btn" onclick="event.stopPropagation();location.href=\'app.html?id=' + a.id + '\'">Install</button></div>';
            });
            list.innerHTML = html;
            document.getElementById('allLoaded').style.display = 'block';
        }

        db.collection('apps').orderBy('downloads', 'desc').get().then(function(snap) {
            allApps = snap.docs.map(function(d) { return processAppName(Object.assign({id: d.id}, d.data())); });
            renderList(allApps);
        });

        document.getElementById('filterBar').addEventListener('click', function(e) {
            if (!e.target.classList.contains('chip')) return;
            document.querySelectorAll('.chip').forEach(function(c) { c.classList.remove('active'); });
            e.target.classList.add('active');
            currentCat = e.target.dataset.cat;
            var filtered = currentCat === 'all' ? allApps : allApps.filter(function(a) { return a.category === currentCat; });
            renderList(filtered);
        });
    </script>
</body>
</html>
