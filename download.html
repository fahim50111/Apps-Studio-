<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download - Apps Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="header-spacer"></div>

    <div style="max-width:500px;margin:40px auto;padding:0 20px;text-align:center;">
        <i class="fas fa-download" style="font-size:48px;color:#1a73e8;margin-bottom:16px;"></i>
        <h1 style="font-size:22px;margin-bottom:12px;">Available Downloads</h1>
        <p style="color:#666;margin-bottom:24px;">Your download will start shortly. If it doesn't, use the button below.</p>
        <div id="downloadArea">
            <div class="loading-screen"><div class="spinner"></div><p>Preparing download...</p></div>
        </div>
    </div>

    <div id="footerContainer"></div>
    <div id="modalsContainer"></div>
    <div id="navContainer"></div>

    <script>
        document.getElementById('headerContainer').innerHTML = renderHeader();
        document.getElementById('footerContainer').innerHTML = renderFooter();
        document.getElementById('modalsContainer').innerHTML = renderSharedModals();
        document.getElementById('navContainer').innerHTML = renderBottomNav('home');

        var params = new URLSearchParams(location.search);
        var appId = params.get('id');
        var link = params.get('link');

        if (link) {
            document.getElementById('downloadArea').innerHTML = '<a href="' + link + '" style="display:inline-block;background:#1a73e8;color:white;padding:14px 32px;border-radius:24px;text-decoration:none;font-weight:700;" target="_blank"><i class="fas fa-download"></i> Download Now</a>';
            setTimeout(function() { window.open(link, '_blank'); }, 1500);
        } else if (appId) {
            db.collection('apps').doc(appId).get().then(function(doc) {
                if (doc.exists && doc.data().downloadLink) {
                    var dl = doc.data().downloadLink;
                    document.getElementById('downloadArea').innerHTML = '<a href="' + dl + '" style="display:inline-block;background:#1a73e8;color:white;padding:14px 32px;border-radius:24px;text-decoration:none;font-weight:700;" target="_blank"><i class="fas fa-download"></i> Download Now</a>';
                    setTimeout(function() { window.open(dl, '_blank'); }, 1500);
                } else {
                    document.getElementById('downloadArea').innerHTML = '<p style="color:#c62828;">Download link not available</p><a href="index.html" style="color:#1a73e8;">Go Home</a>';
                }
            });
        } else {
            document.getElementById('downloadArea').innerHTML = '<p style="color:#888;">No download specified</p><a href="index.html" style="color:#1a73e8;">Go Home</a>';
        }
    </script>
</body>
</html>
