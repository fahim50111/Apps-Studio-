<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request an App - Apps Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <div id="headerContainer"></div>
    <div class="header-spacer"></div>

    <div class="request-section">
        <h3><i class="fas fa-paper-plane" style="color:#1a73e8;margin-right:8px;"></i>Request an App</h3>
        <p style="color:#666;font-size:13px;margin-bottom:16px;">Can't find the app you need? Request it and we'll add it!</p>
        <textarea id="requestText" placeholder="Enter the app name and any details..." rows="4"></textarea>
        <button onclick="submitRequest()" style="margin-top:12px;width:100%;background:#1a73e8;color:white;border:none;padding:12px;border-radius:12px;font-weight:600;cursor:pointer;">
            <i class="fas fa-paper-plane"></i> Send Request
        </button>
        <p id="requestStatus" style="margin-top:12px;font-size:13px;text-align:center;"></p>
    </div>

    <div id="footerContainer"></div>
    <div id="modalsContainer"></div>
    <div id="navContainer"></div>

    <script>
        document.getElementById('headerContainer').innerHTML = renderHeader();
        document.getElementById('footerContainer').innerHTML = renderFooter();
        document.getElementById('modalsContainer').innerHTML = renderSharedModals();
        document.getElementById('navContainer').innerHTML = renderBottomNav('request');

        function submitRequest() {
            var text = document.getElementById('requestText').value.trim();
            if (!text) { showToast('Please enter a request'); return; }
            db.collection('requests').add({
                text: text,
                timestamp: Date.now(),
                status: 'pending'
            }).then(function() {
                document.getElementById('requestText').value = '';
                document.getElementById('requestStatus').innerHTML = '<span style="color:#2e7d32;">Request sent successfully!</span>';
                showToast('Request submitted!');
            }).catch(function(e) {
                document.getElementById('requestStatus').innerHTML = '<span style="color:#c62828;">Failed to send. Try again.</span>';
            });
        }
    </script>
</body>
</html>
